name: Build and Deploy Rust WASM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build Rust library
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Build WASM
        run: wasm-pack build --target web --out-dir web/pkg -- --features wasm

      - name: Generate version info
        run: |
          echo '{
            "version": "6.0.'${{ github.run_number }}'",
            "buildDate": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
            "timestamp": '$(date +%s)',
            "commit": "'${{ github.sha }}'",
            "runNumber": ${{ github.run_number }},
            "engine": "Rust + WASM",
            "techniques": 162
          }' > version.json

      - name: Copy build artifacts to docs
        run: |
          mkdir -p docs/pkg
          if [ -d web/pkg ]; then
            cp -r web/pkg/* docs/pkg/ 2>/dev/null || true
          fi
          cp web/index.html docs/index.html 2>/dev/null || true
          cp version.json docs/version.json 2>/dev/null || true
          ls -la docs/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Create version tag
        run: |
          TAG="v6.0.${{ github.run_number }}-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Rust WASM release $TAG" || true
          git push origin "$TAG" || true
        continue-on-error: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
