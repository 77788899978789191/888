name: Build and Deploy Rust WASM

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/pkg/**'
      - 'docs/version.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build Rust library
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Build WASM
        run: wasm-pack build --target web --out-dir web/pkg -- --features wasm

      - name: Generate version info
        run: |
          echo '{
            "version": "7.0.'${{ github.run_number }}'",
            "buildDate": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
            "timestamp": '$(date +%s)',
            "commit": "'${{ github.sha }}'",
            "runNumber": ${{ github.run_number }},
            "engine": "Rust + WASM",
            "techniques": 238
          }' > version.json

      - name: Copy build artifacts to docs
        run: |
          mkdir -p docs/pkg
          if [ -d web/pkg ]; then
            cp -r web/pkg/* docs/pkg/ 2>/dev/null || true
          fi
          cp web/index.html docs/index.html 2>/dev/null || true
          cp version.json docs/version.json 2>/dev/null || true
          echo "=== docs content ==="
          ls -la docs/
          echo "=== docs/pkg content ==="
          ls -la docs/pkg/

      # ===== 关键步骤：把 WASM 产物提交回 main 分支的 /docs =====
      # GitHub Pages 部署源为 main 分支 /docs 目录，
      # 因此必须将 docs/pkg 提交回仓库，网页才能加载 WASM。
      - name: Commit WASM artifacts back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/pkg docs/version.json docs/index.html version.json
          git diff --cached --quiet && echo "No changes to commit" || {
            git commit -m "chore: deploy WASM build artifacts [skip ci]"
            git push origin main
            echo "Pushed WASM artifacts to main"
          }

      - name: Create version tag
        run: |
          TAG="v7.0.${{ github.run_number }}-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Rust WASM release $TAG" || true
          git push origin "$TAG" || true
        continue-on-error: true
