<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gungnir WASM - Lua 5.1 混淆器</title>
    <style>
        body {
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
            background: #050807;
            color: #c8f5d4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #00ff41;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 300px 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .panel {
            border: 1px solid #1a3324;
            background: #0a0f0c;
            display: flex;
            flex-direction: column;
            min-height: 400px;
        }
        .panel-header {
            padding: 10px 16px;
            border-bottom: 1px solid #1a3324;
            background: rgba(0, 255, 65, 0.02);
            color: #00ff41;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        textarea {
            flex: 1;
            background: #070b09;
            color: #c8f5d4;
            border: none;
            outline: none;
            resize: none;
            padding: 16px;
            font-family: inherit;
            font-size: 12.5px;
            line-height: 1.6;
            tab-size: 4;
        }
        .controls {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .ctrl-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .ctrl-label {
            font-size: 11px;
            color: #5a8a6a;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            justify-content: space-between;
        }
        .ctrl-label b {
            color: #00ff41;
            font-size: 14px;
        }
        input[type=range] {
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #00b32d, #0a3d1a);
            outline: none;
        }
        button {
            border: 1px solid #00b32d;
            background: rgba(0, 255, 65, 0.15);
            color: #00ff41;
            font-family: inherit;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: rgba(0, 255, 65, 0.25);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }
        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .status-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 11px;
            margin-bottom: 16px;
        }
        .status-item {
            color: #5a8a6a;
        }
        .status-item b {
            color: #00ff41;
        }
        #log {
            background: #070b09;
            border: 1px solid #1a3324;
            padding: 12px;
            font-size: 11px;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-line {
            color: #5a8a6a;
            margin-bottom: 4px;
        }
        .log-line.success {
            color: #00ff41;
        }
        .log-line.error {
            color: #ff3355;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>冈格尼尔 · GUNGNIR <span style="font-size: 0.6em;">WASM版</span></h1>
        <div class="status-bar">
            <span class="status-item">版本 <b id="version">加载中...</b></span>
            <span class="status-item">技术 <b id="techniques">200</b></span>
            <span class="status-item">引擎 <b>Rust + WASM</b></span>
        </div>

        <div class="main-grid">
            <div class="panel">
                <div class="panel-header">源码输入</div>
                <textarea id="inputCode" placeholder="在此粘贴 Lua 源码...">local x = 10
local y = x * 3 + 7
print("Result:", y)</textarea>
            </div>

            <div class="panel">
                <div class="panel-header">混淆配置</div>
                <div class="controls">
                    <div class="ctrl-group">
                        <div class="ctrl-label"><span>混淆强度</span><b id="intensityVal">10</b></div>
                        <input type="range" id="intensitySlider" min="1" max="10" value="10">
                    </div>
                    <button id="obfuscateBtn" disabled>加载WASM中...</button>
                    <button id="loadSampleBtn">加载示例</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">混淆输出</div>
                <textarea id="outputCode" readonly placeholder="混淆结果将显示在这里..."></textarea>
            </div>
        </div>

        <div id="log"></div>
    </div>

    <script type="module">
        import init, { obfuscate, getVersion, getTotalTechniques, getMaximumConfig } from './pkg/gungnir.js';

        const log = (msg, type = '') => {
            const logEl = document.getElementById('log');
            const div = document.createElement('div');
            div.className = 'log-line ' + type;
            div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        };

        async function main() {
            try {
                await init();
                document.getElementById('version').textContent = getVersion();
                document.getElementById('techniques').textContent = getTotalTechniques();
                document.getElementById('obfuscateBtn').disabled = false;
                document.getElementById('obfuscateBtn').textContent = '开始混淆';
                log('WASM模块加载成功', 'success');
                log('版本: ' + getVersion() + ', 技术: ' + getTotalTechniques(), 'success');
            } catch (e) {
                log('WASM加载失败: ' + e.message, 'error');
            }
        }

        document.getElementById('obfuscateBtn').addEventListener('click', () => {
            const code = document.getElementById('inputCode').value;
            if (!code.trim()) {
                log('请先输入Lua源码', 'error');
                return;
            }

            const intensity = document.getElementById('intensitySlider').value;
            const config = JSON.parse(getMaximumConfig());
            config.intensity = 'Level' + intensity;

            log('开始混淆... 强度: ' + intensity);
            const start = performance.now();

            try {
                const result = obfuscate(code, JSON.stringify(config));
                const duration = performance.now() - start;

                if (result.success) {
                    document.getElementById('outputCode').value = result.output;
                    log('混淆完成! 耗时: ' + duration.toFixed(2) + 'ms, 输出: ' + result.output.length + '字节', 'success');
                } else {
                    log('混淆失败: ' + result.error, 'error');
                }
            } catch (e) {
                log('混淆异常: ' + e.message, 'error');
            }
        });

        document.getElementById('intensitySlider').addEventListener('input', function() {
            document.getElementById('intensityVal').textContent = this.value;
        });

        document.getElementById('loadSampleBtn').addEventListener('click', () => {
            document.getElementById('inputCode').value = `-- Gungnir 测试脚本
local function add(a, b)
  return a + b
end
local function factorial(n)
  if n <= 1 then return 1 end
  return n * factorial(n - 1)
end
local x = 10
local y = 20
print("Results:", add(x, y), factorial(5))
for i = 1, 10 do
  print("Loop:", i)
end`;
            log('已加载示例代码');
        });

        main();
    </script>
</body>
</html>
